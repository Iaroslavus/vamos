name: DB

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    name: migrations + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # paths-filter lists PR files via the API. contents: read is enough for checkout.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5

      # Required on every PR, so the job always runs and succeeds. The local stack
      # (and the type drift check, which needs that stack) runs only when supabase/** changed.
      - name: Detect supabase changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            supabase:
              - 'supabase/**'

      - uses: actions/setup-node@v5
        if: steps.changes.outputs.supabase == 'true'
        with:
          node-version: 22
          cache: npm
      # Pinned: `supabase gen types` output depends on the CLI version, and the drift
      # check below compares it with the committed file. Bump together with `brew upgrade supabase`.
      - uses: supabase/setup-cli@v1
        if: steps.changes.outputs.supabase == 'true'
        with:
          version: 2.121.0

      # Local stack only (Docker). Services that are not needed to run migrations and
      # pgTAP are excluded to keep the job fast.
      - name: supabase start
        if: steps.changes.outputs.supabase == 'true'
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api

      - name: supabase db reset
        if: steps.changes.outputs.supabase == 'true'
        run: supabase db reset

      - name: supabase test db
        if: steps.changes.outputs.supabase == 'true'
        run: supabase test db

      # src/lib/database.types.ts must match the migrations. Regenerate with `npm run db:types`.
      - run: npm ci
        if: steps.changes.outputs.supabase == 'true'
      - name: Check generated types are up to date
        if: steps.changes.outputs.supabase == 'true'
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/database.types.ts \
            || { echo '::error::src/lib/database.types.ts is out of date. Run `npm run db:types` and commit.'; exit 1; }

      - name: supabase stop
        if: always() && steps.changes.outputs.supabase == 'true'
        run: supabase stop --no-backup
