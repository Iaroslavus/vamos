name: DB

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/lib/database.types.ts'
      - '.github/workflows/db.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/lib/database.types.ts'
      - '.github/workflows/db.yml'

concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    name: migrations + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Pinned: `supabase gen types` output depends on the CLI version, and the drift
      # check below compares it with the committed file. Bump together with `brew upgrade supabase`.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Local stack only (Docker). Services that are not needed to run migrations and
      # pgTAP are excluded to keep the job fast.
      - name: supabase start
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime,storage-api

      - name: supabase db reset
        run: supabase db reset

      - name: supabase test db
        run: supabase test db

      # src/lib/database.types.ts must match the migrations. Regenerate with `npm run db:types`.
      - run: npm ci
      - name: Check generated types are up to date
        run: |
          npm run db:types
          git diff --exit-code -- src/lib/database.types.ts \
            || { echo '::error::src/lib/database.types.ts is out of date. Run `npm run db:types` and commit.'; exit 1; }

      - name: supabase stop
        if: always()
        run: supabase stop --no-backup
