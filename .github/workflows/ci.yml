name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `typecheck` runs `expo customize tsconfig.json` first so typed routes
      # (.expo/types) exist — same generation path as a local `expo start`.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci --passWithNoTests
      - run: npm run content:check
      - run: npx expo export --platform android --output-dir dist
